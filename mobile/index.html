<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#241d33" />
    <!-- Slice 13: the address may hold an invite code; never send it on. -->
    <meta name="referrer" content="no-referrer" />
    <title>Arena of Ideas</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Cpath d=%22M3 0h13v13l-3 3H0V3z%22 fill=%22%23f0c24b%22/%3E%3C/svg%3E" />
    <!-- Lilita One and Rubik are self-hosted (./fonts): nothing loads from outside. -->
    <!-- Before any script or font: the title and a loader on the page's ground colour, so a slow load is never a blank box (arena#31). -->
    <style>
      html, body { margin: 0; background: #241d33; }
      .boot { box-sizing: border-box; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; color: #fbf7f0; font: 700 15px/1.2 system-ui, sans-serif; }
      .boot h1 { margin: 0; font: 400 30px/1 "Lilita One", system-ui, sans-serif; letter-spacing: 0.12em; }
      .boot-bar { width: 220px; height: 10px; border: 3px solid #120e1c; border-radius: 8px; background: #3e3459; overflow: hidden; }
      .boot-bar i { display: block; width: 40%; height: 100%; background: #f0c24b; animation: boot-bar 1s ease-in-out infinite alternate; }
      @keyframes boot-bar { from { transform: translateX(0); } to { transform: translateX(150%); } }
      @media (prefers-reduced-motion: reduce) { .boot-bar i { animation: none; width: 100%; } }
    </style>
    <link rel="stylesheet" href="./fonts/fonts.css" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./table.css" />
  </head>
  <body>
    <main id="app">
      <div class="boot" data-testid="boot-loader"><h1 id="boot-title">ARENA OF IDEAS</h1><div class="boot-bar"><i></i></div><div id="boot-msg">Loading…</div></div>
    </main>
    <script>
      // The loader's words follow the player's language, as lang.ts picks it (the address, the saved switch, the phone).
      try {
        var q = new URLSearchParams(location.search).get("lang"), saved = localStorage.getItem("arena.lang");
        var ru = q === "ru" || (q !== "en" && (saved === "ru" || (saved !== "en" && /^ru\b/i.test(navigator.language || ""))));
        if (ru) { document.getElementById("boot-title").textContent = "АРЕНА ИДЕЙ"; document.getElementById("boot-msg").textContent = "Загрузка…"; }
      } catch (e) {}
    </script>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
